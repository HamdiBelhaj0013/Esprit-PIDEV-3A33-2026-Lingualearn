parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Load all services from src/
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            - '../src/Module/*/Entity/'

    # Load controllers from each module individually
    App\Module\UserManagement\Controller\:
        resource: '../src/Module/UserManagement/Controller'
        tags: ['controller.service_arguments']

