parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Load all services from src/
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            - '../src/Module/*/Entity/'

    # Main app controllers (including User subfolder)
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Load controllers from each module individually
    App\Module\UserManagement\Controller\:
        resource: '../src/Module/UserManagement/Controller'
        tags: ['controller.service_arguments']

    App\Module\ExercisesQuizzes\Controller\:
        resource: '../src/Module/ExercisesQuizzes/Controller'
        tags: ['controller.service_arguments']

    App\Module\Forum\Controller\:
        resource: '../src/Module/Forum/Controller'
        tags: ['controller.service_arguments']

    App\Module\InternationalTests\Controller\:
        resource: '../src/Module/InternationalTests/Controller'
        tags: ['controller.service_arguments']

    App\Module\PedagogicalContent\Controller\:
        resource: '../src/Module/PedagogicalContent/Controller'
        tags: ['controller.service_arguments']

    App\Module\Support\Controller\:
        resource: '../src/Module/Support/Controller'
        tags: ['controller.service_arguments']

    # Security - Login Success Handler for role-based redirects
    App\Security\LoginSuccessHandler:
        arguments:
            $urlGenerator: '@router'

    App\Module\UserManagement\Service\EmailVerificationService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Module\UserManagement\Service\PasswordResetService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    # =========================================================
    # STRIPE PAYMENT
    # =========================================================

    Stripe\StripeClient:
        arguments:
            - '%env(STRIPE_SECRET_KEY)%'

    App\Module\UserManagement\Service\StripeService:
        arguments:
            $priceMonthly: '%env(STRIPE_PRICE_MONTHLY)%'
            $priceYearly:  '%env(STRIPE_PRICE_YEARLY)%'
        calls:
            - setUserService: ['@App\Module\UserManagement\Service\UserService']

    App\Module\UserManagement\Controller\StripeWebhookController:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
        tags: ['controller.service_arguments']

    # =========================================================
    # INTERNATIONAL TESTS
    # =========================================================

    App\Module\InternationalTests\Service\GeminiListeningService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'

    App\Module\InternationalTests\Service\GeminiWritingService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'

    App\Module\InternationalTests\Service\AssemblyAiService:
        arguments:
            $assemblyAiApiKey: '%env(ASSEMBLYAI_API_KEY)%'

    # Speaking Service — uses Groq (llama-3.3-70b)
    App\Module\InternationalTests\Service\GeminiSpeakingService:
        arguments:
            $groqApiKey: '%env(GROQ_API_KEY)%'

    # Gemini Embedding Service
    App\Module\InternationalTests\Service\GeminiEmbeddingService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'

    # Deepgram Transcription Service
    App\Module\InternationalTests\Service\DeepgramTranscriptionService:
        arguments:
            $deepgramApiKey: '%env(DEEPGRAM_API_KEY)%'

    # =========================================================
    # EXERCISES & QUIZZES - AI
    # =========================================================

    App\Module\ExercisesQuizzes\Client\HuggingFaceInferenceClient:
        arguments:
            $baseUrl: '%env(HUGGINGFACE_API_URL)%'
            $model: '%env(HUGGINGFACE_MODEL)%'
            $apiToken: '%env(HUGGINGFACE_API_TOKEN)%'

    App\Module\ExercisesQuizzes\Client\HuggingFaceAiCoachClient:
        arguments:
            $baseUrl: '%env(HUGGINGFACE_API_URL)%'
            $model: '%env(HUGGINGFACE_MODEL)%'
            $apiToken: '%env(HUGGINGFACE_API_TOKEN)%'

    App\Module\ExercisesQuizzes\Client\AiCoachClientInterface:
        alias: App\Module\ExercisesQuizzes\Client\HuggingFaceAiCoachClient

    # =========================================================
    # EXERCISES & QUIZZES - State machine guards
    # =========================================================
    App\Module\ExercisesQuizzes\Service\QuizAttemptStateMachineGuard:
        public: true

    App\Service\NotificationService:
        arguments:
            $appId: '%env(PUSHER_APP_ID)%'
            $key: '%env(PUSHER_APP_KEY)%'
            $secret: '%env(PUSHER_APP_SECRET)%'
            $cluster: '%env(PUSHER_APP_CLUSTER)%'

    # =========================================================
    # SUPPORT MODULE - PUSHER
    # =========================================================

    App\Module\Support\Service\PusherService:
        arguments:
            $appKey:    '%env(PUSHER_APP_KEY)%'
            $appSecret: '%env(PUSHER_APP_SECRET)%'
            $appId:     '%env(PUSHER_APP_ID)%'
            $cluster:   '%env(PUSHER_APP_CLUSTER)%'

    App\Module\Support\Service\NotificationService:
        arguments:
            $pusherService: '@App\Module\Support\Service\PusherService'

    # =========================================================
    # FACE RECOGNITION
    # =========================================================

    App\Module\UserManagement\Service\FaceRecognitionService:
        arguments:
            $faceApiUrl: '%env(FACE_API_URL)%'

    # =========================================================
    # SUMMARIZER
    # =========================================================

    App\Service\HuggingFaceSummarizer:
        arguments:
            $hfApiKey: '%env(HUGGINGFACE_API_TOKEN)%'
            $hfModel: '%env(HUGGINGFACE_SUMMARY_MODEL)%'
