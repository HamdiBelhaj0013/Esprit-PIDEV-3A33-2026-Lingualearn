security:
    # Password hashers
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Providers
    providers:
        app_user_provider:
            entity:
                class: App\Module\UserManagement\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Admin firewall — handles /admin/* routes
        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                default_target_path: admin_dashboard
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_admin_logout
                target: app_admin_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /admin
                always_remember_me: true

        # Main firewall — handles all other routes including /dashboard
        main:
            pattern: ^/
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: user_dashboard
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false

    access_control:
        # Public routes — no login needed
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/setup, roles: PUBLIC_ACCESS }

        # Admin routes — ROLE_ADMIN only (enforced at both firewall AND access_control level)
        - { path: ^/admin, roles: ROLE_ADMIN }

        # User routes — any authenticated user
        - { path: ^/dashboard, roles: ROLE_USER }

    # Role hierarchy - admins inherit user permissions
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
