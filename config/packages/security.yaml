security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Module\UserManagement\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_admin_logout
                target: app_admin_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            pattern: ^/
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        # Stripe webhook — must be public, Stripe posts here as external service
        - { path: ^/stripe/webhook,  roles: PUBLIC_ACCESS }
        - { path: ^/setup/enroll-face, roles: PUBLIC_ACCESS }
        # Auth & public pages
        - { path: ^/admin/login,     roles: PUBLIC_ACCESS }
        - { path: ^/admin/face/verify,   roles: PUBLIC_ACCESS }
        - { path: ^/login,           roles: PUBLIC_ACCESS }
        - { path: ^/register,        roles: PUBLIC_ACCESS }
        - { path: ^/$,               roles: PUBLIC_ACCESS }

        # Email verification (must be public — user is not logged in yet)
        - { path: ^/verify,          roles: PUBLIC_ACCESS }

        # Password reset (must be public — user can't log in without it)
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password,  roles: PUBLIC_ACCESS }

        # Protected areas
        - { path: ^/admin,      roles: ROLE_ADMIN }
        - { path: ^/dashboard,  roles: ROLE_USER }
        - { path: ^/ressources,      roles: ROLE_USER }


    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
